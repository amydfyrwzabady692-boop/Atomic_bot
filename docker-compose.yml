services:
  db:
    image: postgres:15-alpine
    container_name: atomic_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-accshop}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - atomic_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # فقط داخل شبکه ربات — به tasino دست نمی‌زند
    expose:
      - "5432"
    networks:
      - botnet
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-accshop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: atomic_bot
    restart: unless-stopped
    env_file:
      - .env
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-accshop}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:?ZARINPAL_MERCHANT_ID is required}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-0}
      G2BULK_API_KEY: ${G2BULK_API_KEY:?G2BULK_API_KEY is required}
      G2BULK_GAME_CODE: ${G2BULK_GAME_CODE:-freefire_me}
      USD_TOMAN_RATE: ${USD_TOMAN_RATE:-}
      CARD_TRANSFER_NUMBER: ${CARD_TRANSFER_NUMBER:-}
      CARD_TRANSFER_HOLDER: ${CARD_TRANSFER_HOLDER:-}
      CARD_TRANSFER_BANK: ${CARD_TRANSFER_BANK:-سامان}
      CARD_NUMBER: ${CARD_NUMBER:-}
      CARD_HOLDER: ${CARD_HOLDER:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      BOT_DOMAIN: ${BOT_DOMAIN:-botatomic.atomicshop.ir}
      PAYMENT_CALLBACK_BASE: ${PAYMENT_CALLBACK_BASE:-https://botatomic.atomicshop.ir}
      WEB_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - botnet
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Caddy خاموش — روی این وی‌پی‌اس nginx مشترک پورت 80 را دارد
  proxy:
    image: caddy:2
    profiles: ["caddy"]
    container_name: atomic_bot_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:-botatomic.atomicshop.ir}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
    networks:
      - botnet

networks:
  botnet:

volumes:
  atomic_pgdata:
  caddy_data:
  caddy_config:
